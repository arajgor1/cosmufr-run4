[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmufr"
version = "1.0.0"
description = "CosmUFR Run 4: 137M-parameter belief-settling neural network for cosmological parameter inference from matter power spectra."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aaditya Rajgor", email = "aadityarajgor27@gmail.com" }]
keywords = ["cosmology", "neural-network", "power-spectrum", "emulator", "belief-state", "ufr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "huggingface_hub>=1.9.0",
]

[project.optional-dependencies]
demo = [
    "matplotlib>=3.7",
    "jupyter",
    "scipy>=1.11",
]
dev = [
    "pytest>=7.4",
]

[project.urls]
Homepage     = "https://github.com/arajgor1/cosmufr-run4"
"Model Card" = "https://huggingface.co/arajgor1/cosmufr-run4"

[tool.setuptools.packages.find]
include = ["cosmufr*"]
exclude = ["tests*", "examples*", "_local_ckpt*"]
