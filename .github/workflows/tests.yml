name: tests

# The argument this repository makes is that a one-second test would have caught
# its central defect on the day it was introduced. Not running that test on every
# push would undercut the argument.
#
# Two jobs, split by whether they need the 545 MB checkpoint:
#   fast  - architecture and data integrity only, no download, runs on every push
#   full  - pulls the released weights and runs everything, nightly and on demand

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast (no checkpoint)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU torch only)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Gradient-flow guard
        # These need no weights: they demonstrate from the architecture alone
        # that only param_head receives gradient. This is the test that would
        # have caught the defect on day one.
        run: pytest tests/test_gradient_flow.py -v --tb=short

      - name: Benchmark integrity
        run: pytest tests/test_reproducibility.py -v --tb=short -m "not slow"

      - name: Diagrams still render
        run: |
          python -m cosmufr.diagram
          test -s docs/architecture.svg
          test -s docs/architecture_audit.svg

  full:
    name: full (with released weights)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,demo]"

      - name: Cache the checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: cosmufr-ckpt-5db09d4f

      - name: Fetch the released weights and verify the hash
        run: |
          python - <<'PY'
          import hashlib, os
          from huggingface_hub import hf_hub_download
          p = hf_hub_download(repo_id="arajgor1/cosmufr-run4", filename="best.pt")
          h = hashlib.sha256()
          with open(p, "rb") as f:
              for c in iter(lambda: f.read(1 << 20), b""):
                  h.update(c)
          want = "5db09d4ff02316c60a43e08fa242223d3243f4f224b625798eaf385151150fc1"
          assert h.hexdigest() == want, f"checkpoint hash {h.hexdigest()} != {want}"
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"COSMUFR_CKPT={p}\n")
          print("checkpoint verified")
          PY

      - name: Full test suite
        run: pytest tests/ -v --tb=short

      - name: The published numbers still reproduce
        run: python -m cosmufr.reproduce --ckpt "$COSMUFR_CKPT"
